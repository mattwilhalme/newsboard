name: Newsboard manual browser backup

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PLAYWRIGHT_BROWSER_CHANNEL: chrome

concurrency:
  group: newsboard-browser-backup
  cancel-in-progress: false

jobs:
  manual-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browser backup to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/crawl/github-backup.mjs
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: manual-backup-archive
          path: archive
          if-no-files-found: ignore
