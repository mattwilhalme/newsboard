name: Newsboard browser gap fill

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Supabase dispatch attempt UUID (leave empty for manual runs)
        required: false
        type: string
      validate_ap:
        description: Test AP homepage access without database writes
        required: false
        default: false
        type: boolean
      validation_runner:
        description: Hosted runner for the read-only AP access test
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
      validation_browser:
        description: Mobile browser for the read-only AP access test
        required: false
        default: chrome
        type: choice
        options:
          - chrome
          - webkit
          - browserbase

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PLAYWRIGHT_BROWSER_CHANNEL: chrome
  NEWSBOARD_AP_BROWSER_PROVIDER: ${{ vars.NEWSBOARD_AP_BROWSER_PROVIDER || 'local' }}
  NEWSBOARD_AP_BROWSERBASE_PROXY: ${{ vars.NEWSBOARD_AP_BROWSERBASE_PROXY || 'false' }}

concurrency:
  group: ${{ inputs.validate_ap && 'newsboard-ap-validation' || 'newsboard-browser-gap-fill' }}
  cancel-in-progress: false

jobs:
  browser-gap-fill:
    runs-on: ${{ inputs.validate_ap && inputs.validation_runner || 'ubuntu-latest' }}
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Record runner start
        run: echo "NEWSBOARD_RUNNER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install WebKit for mobile Safari validation
        if: ${{ inputs.validate_ap && inputs.validation_browser == 'webkit' }}
        run: npx playwright install --with-deps webkit
      - name: Browser gap fill to Supabase
        if: ${{ !inputs.validate_ap }}
        env:
          NEWSBOARD_DISPATCH_ID: ${{ inputs.dispatch_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
        run: node scripts/crawl/github-browser-gap-fill.mjs
      - name: Validate AP without database writes
        if: ${{ inputs.validate_ap }}
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
        run: node scripts/crawl/validate-ap.mjs --browser ${{ inputs.validation_browser || 'chrome' }}
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-gap-fill-archive
          path: archive
          if-no-files-found: ignore
          retention-days: 3
