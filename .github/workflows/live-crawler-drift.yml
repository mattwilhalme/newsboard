name: Newsboard live crawler drift

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsboard-live-crawler-drift
  cancel-in-progress: false

jobs:
  validate-live-collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate live publishers without database writes
        run: npm run test:crawler-drift
      - name: Save drift diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-crawler-drift
          path: archive/live-crawler-drift.json
          if-no-files-found: warn
          retention-days: 7

